<!DOCTYPE html>
<html>
    <head>
        <!-- Ubuntu is self-hosted in styles.css. Nothing here may point at a font
             CDN: a card box is a fixed pixel size drawn for Ubuntu's metrics, so a
             request that is slow, blocked or offline redraws every card in the
             platform's own sans-serif and the text stops fitting. -->
        <link rel="stylesheet" type="text/css" media="all" href="styles.css" />
        <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
        <link rel="manifest" href="assets/manifest.webmanifest" />
        <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
        <meta name="viewport" content='width=device-width, initial-scale=1, viewport-fit=cover' />
        <meta name="theme-color" content="#15100e" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Terraforming Mars" />
        <meta name="description" content="Terraforming Mars Open Source Web Application" />
    </head>
    <body id="ts-preferences-target">
        <div id="app"></div>
        <script src="vendors.js"></script>
        <script src="main.js"></script>
    </body>
</html>
